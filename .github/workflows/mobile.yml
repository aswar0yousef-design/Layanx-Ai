name: LayanX Mobile CI

on:
  push:
    branches: [main, "wip/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo export --platform android

  # The installable Android app: the JavaScript bundle plus the native part (encrypted link, live
  # notifications, fingerprint approvals, quick tile, widget, voice).
  # Signing: with the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD the APK is signed with the owner's own key (only an APK
  # signed with that key can update the installed app). Without them it falls back to the Expo template's
  # public debug key and says so.
  android-apk:
    needs: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "file=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the public Expo debug key. See mobile/BUILD.md (own signing key)."
          fi
      - name: Build the APK (arm64 phones)
        working-directory: mobile/android
        env:
          KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          SIGN=()
          if [ -n "$KEYSTORE_FILE" ]; then
            SIGN=(-Pandroid.injected.signing.store.file="$KEYSTORE_FILE" -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
                  -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASSWORD")
          fi
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a "${SIGN[@]}" > build.log 2>&1
          status=$?
          tail -40 build.log
          if [ $status -ne 0 ]; then
            # Annotations are readable where the full log is not.
            grep -E "^e: |error:|What went wrong|Execution failed|> " build.log | head -30 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit $status
          fi
      - name: Check the APK carries the LayanX native parts
        working-directory: mobile/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          missing=0
          for name in CompanionService ApproveActivity DecisionReceiver BootReceiver AskTileService StatusWidget usesCleartextTraffic PROPERTY_SPECIAL_USE_FGS_SUBTYPE BIND_QUICK_SETTINGS_TILE 'layanx'; do
            grep -q "$name" manifest.txt || { echo "::error::missing in the APK manifest: $name"; missing=1; }
          done
          [ $missing -eq 0 ] || exit 1
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          echo "::notice::APK $(stat -c %s "$APK") bytes; $("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'certificate DN')"
          cp "$APK" ../LayanX-Remote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LayanX-Remote-apk
          path: mobile/LayanX-Remote.apk
          retention-days: 30
      # A stable link to open on the phone: Releases -> "LayanX Remote (Android)" -> LayanX-Remote.apk.
      - name: Publish the APK to the android-latest pre-release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="LayanX Remote for Android, built from ${GITHUB_SHA::7}. Install on the phone, then pair it from the PC setup page (QR code)."
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "LayanX Remote (Android)" --notes "$NOTES" --target "$GITHUB_SHA"
          gh release upload android-latest LayanX-Remote.apk --clobber
          gh release edit android-latest --notes "$NOTES"
