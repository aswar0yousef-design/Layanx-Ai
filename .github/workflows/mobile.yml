name: LayanX Mobile CI

on:
  push:
    branches: [main, "wip/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo export --platform android

  # The installable app, built here: no Expo account needed.
  apk:
    needs: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo prebuild --platform android --no-install
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Sign
        env:
          LAYANX_ANDROID_KEYSTORE: ${{ secrets.LAYANX_ANDROID_KEYSTORE }}
          LAYANX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LAYANX_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$LAYANX_ANDROID_KEYSTORE" ]; then
            echo "$LAYANX_ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/layanx.jks"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/layanx.jks" --ks-pass env:LAYANX_ANDROID_KEYSTORE_PASSWORD --ks-key-alias layanx --out LayanX-Remote.apk "$APK"
            rm -f "$RUNNER_TEMP/layanx.jks"
          else
            cp "$APK" LayanX-Remote.apk
            echo "::notice::Signed with the standard React Native debug key (same on every build, so updates install over each other). Add the LAYANX_ANDROID_KEYSTORE secrets to sign with your own key."
          fi
          "$BT/apksigner" verify LayanX-Remote.apk
      - name: Check what is inside
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml LayanX-Remote.apk > manifest.txt
          for c in com.layanx.nativebridge.WatchService com.layanx.nativebridge.ApprovalActivity com.layanx.nativebridge.VoiceAskActivity com.layanx.nativebridge.AskTileService com.layanx.nativebridge.StatusWidget com.layanx.nativebridge.BootReceiver com.layanx.nativebridge.ActionReceiver android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE android.permission.POST_NOTIFICATIONS android.permission.USE_BIOMETRIC android.permission.CAMERA; do
            grep -q "$c" manifest.txt || { echo "::error::$c is missing from the APK manifest"; exit 1; }
          done
          if grep -q 'usesCleartextTraffic.*true\|RECORD_AUDIO' manifest.txt; then echo "::error::cleartext traffic or microphone permission in the APK"; exit 1; fi
          echo "::notice::APK $(du -h LayanX-Remote.apk | cut -f1): watch service, approval screen, voice, tile, widget and permissions present"
      - uses: actions/upload-artifact@v4
        with:
          name: LayanX-Remote-apk
          path: mobile/LayanX-Remote.apk
          retention-days: 30

  # Starts the app on an Android emulator and fails on any crash at launch.
  launch:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LayanX-Remote-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb install -r LayanX-Remote.apk
            adb logcat -c
            adb shell monkey -p com.layanx.remote -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.layanx.remote || (adb logcat -d | tail -200; exit 1)
            ! adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime: Process: com.layanx.remote" || (adb logcat -d | grep -A40 "FATAL EXCEPTION"; exit 1)
            adb shell dumpsys package com.layanx.remote | grep -E "com.layanx.nativebridge" | head -20
