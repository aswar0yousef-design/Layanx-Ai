name: LayanX CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run security:check
      - name: TypeScript Check\n        run: |\n          set +e\n          npm run typecheck 2>&1 | tee /tmp/layanx-typecheck.log\n          code=${PIPESTATUS[0]}\n          if [ "$code" -ne 0 ]; then\n            echo "## TypeScript diagnostics" >> "$GITHUB_STEP_SUMMARY"\n            cat /tmp/layanx-typecheck.log >> "$GITHUB_STEP_SUMMARY"\n          fi\n          exit "$code"
      - run: npm test
      - run: npm run build
      - name: Start health runtime
        run: |
          PORT=18080 npm start > /tmp/layanx-health.log 2>&1 &
          echo $! > /tmp/layanx-health.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/health > /tmp/layanx-health-response.json; then
              cat /tmp/layanx-health-response.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/layanx-health.log
          exit 1
      - name: Stop health runtime
        if: always()
        run: |
          if [ -f /tmp/layanx-health.pid ]; then kill "$(cat /tmp/layanx-health.pid)" || true; fi
