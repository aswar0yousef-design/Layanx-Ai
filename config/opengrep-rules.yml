# LayanX rules for Opengrep (LGPL-2.1, run as a separate program).
# Written for LayanX (no Semgrep Registry rules are bundled). Syntax: Semgrep/Opengrep rule YAML.
rules:
  - id: layanx.js.eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic code execution (eval / new Function) can run attacker-controlled code.
    pattern-either:
      - pattern: |
          eval($X)
      - pattern: |
          new Function(...)

  - id: layanx.js.exec-dynamic-command
    languages: [javascript, typescript]
    severity: ERROR
    message: A shell command is built from variables (command injection). Use execFile/spawn with an argument array.
    pattern-either:
      - pattern: |
          $CP.exec($A + $B, ...)
      - pattern: |
          $CP.execSync($A + $B, ...)
      - pattern: |
          exec($A + $B, ...)
      - pattern: |
          execSync($A + $B, ...)
      - pattern: |
          $CP.exec(`...${$X}...`, ...)
      - pattern: |
          $CP.execSync(`...${$X}...`, ...)
      - pattern: |
          exec(`...${$X}...`, ...)
      - pattern: |
          execSync(`...${$X}...`, ...)

  - id: layanx.js.spawn-shell-true
    languages: [javascript, typescript]
    severity: WARNING
    message: spawn/execFile with shell true re-enables shell injection. Pass arguments as an array without a shell.
    pattern-either:
      - pattern: |
          $CP.spawn($CMD, $ARGS, {..., shell: true, ...})
      - pattern: |
          spawn($CMD, $ARGS, {..., shell: true, ...})

  - id: layanx.js.innerhtml-dynamic
    languages: [javascript, typescript]
    severity: WARNING
    message: Assigning dynamic HTML to innerHTML allows cross-site scripting. Use textContent or sanitise first.
    patterns:
      - pattern: |
          $EL.innerHTML = $X
      - pattern-not: |
          $EL.innerHTML = "..."
      - pattern-not: |
          $EL.innerHTML = ''

  - id: layanx.js.tls-verification-off
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate checks are turned off; traffic can be intercepted.
    pattern-either:
      - pattern: |
          {..., rejectUnauthorized: false, ...}
      - pattern: |
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: layanx.js.sql-concatenation
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL text is built from variables (SQL injection). Use parameters ($1, ?).
    pattern-either:
      - pattern: |
          $DB.query("..." + $X, ...)
      - pattern: |
          $DB.query(`...${$X}...`, ...)
      - pattern: |
          $DB.execute("..." + $X, ...)
      - pattern: |
          $DB.execute(`...${$X}...`, ...)

  - id: layanx.js.jwt-hardcoded-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: The JWT signing secret is written in the code. Read it from the environment / secret store.
    pattern-either:
      - pattern: |
          $JWT.sign($P, "...", ...)
      - pattern: |
          $JWT.verify($T, "...", ...)

  - id: layanx.py.subprocess-shell
    languages: [python]
    severity: ERROR
    message: subprocess with shell=True allows command injection. Pass a list of arguments.
    pattern: |
      subprocess.$F(..., shell=True, ...)

  - id: layanx.py.unsafe-deserialisation
    languages: [python]
    severity: ERROR
    message: pickle / yaml.load on untrusted data can run code. Use json or yaml.safe_load.
    pattern-either:
      - pattern: |
          pickle.loads(...)
      - pattern: |
          pickle.load(...)
      - patterns:
          - pattern: |
              yaml.load($X)
          - pattern-not: |
              yaml.load($X, Loader=yaml.SafeLoader)

  - id: layanx.py.tls-verification-off
    languages: [python]
    severity: ERROR
    message: requests with verify=False disables certificate checks.
    pattern: |
      requests.$M(..., verify=False, ...)

  - id: layanx.py.eval
    languages: [python]
    severity: ERROR
    message: eval/exec on data can run attacker-controlled code.
    pattern-either:
      - pattern: |
          eval($X)
      - pattern: |
          exec($X)

  - id: layanx.py.sql-formatting
    languages: [python]
    severity: ERROR
    message: SQL text is built with string formatting (SQL injection). Use query parameters.
    pattern-either:
      - pattern: |
          $CUR.execute(f"...", ...)
      - pattern: |
          $CUR.execute("..." % $X, ...)
      - pattern: |
          $CUR.execute("..." + $X, ...)
      - pattern: |
          $CUR.execute("...".format(...), ...)
